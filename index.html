<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asia Home — Расчёт мебели</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--border:#2e2e2e;
  --text:#e8e8e8;--text2:#888;--text3:#555;
  --accent:#c8a96e;--accent2:#a88a52;
  --green:#4caf7d;--red:#e05252;--blue:#5b8dee;
  --r:8px;--r2:12px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{cursor:pointer;font-size:13px;border-radius:var(--r);border:none;padding:8px 16px;transition:.15s}
.btn-primary{background:var(--accent);color:#111;font-weight:600}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem;width:100%;max-width:380px}
.login-logo{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2rem}
.login-field{margin-bottom:1rem}
.login-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}
#app{display:none;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:15px;font-weight:700;color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:12px}
.role-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.role-manager{background:#1a2e1a;color:var(--green)}
.role-owner{background:#2e2a1a;color:var(--accent)}
.role-fin{background:#1a1a2e;color:var(--blue)}
.main-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:1rem 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;transition:.15s;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(200,169,110,.06)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.content{padding:1.5rem;overflow-y:auto}
.page-title{font-size:18px;font-weight:600;margin-bottom:1.25rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--text2)}
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.tr-total td{background:var(--bg3);font-weight:600;border-top:1px solid var(--border)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.badge-draft{background:#1a1a2e;color:var(--blue)}
.badge-review{background:#2e2a1a;color:var(--accent)}
.badge-approved{background:#1a2e1a;color:var(--green)}
.badge-done{background:#1e1e1e;color:var(--text2)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.metric-value{font-size:22px;font-weight:700;color:var(--text)}
.metric-sub{font-size:11px;color:var(--text3);margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:1.75rem;width:100%;max-width:640px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1.5rem}
.modal-footer{display:flex;gap:10px;margin-top:1.5rem}
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.mat-field{display:flex;flex-direction:column;gap:3px}
.mat-field label{font-size:10px;color:var(--text2);line-height:1.3}
.cost-preview{background:var(--bg3);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:1.25rem}
.desc-list{margin-bottom:8px}
.desc-row{display:flex;gap:6px;margin-bottom:5px}
.section-sep{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--r2);margin-bottom:1.25rem;width:fit-content}
.tab{padding:6px 16px;font-size:13px;font-weight:500;border-radius:var(--r);background:transparent;color:var(--text2)}
.tab.active{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
.upload-zone{border:2px dashed var(--border);border-radius:var(--r2);padding:2rem;text-align:center;cursor:pointer;transition:.15s}
.upload-zone:hover{border-color:var(--accent);background:rgba(200,169,110,.04)}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text2)}
.upload-sub{font-size:12px;color:var(--text3);margin-top:4px}
.ai-loader{display:none;align-items:center;gap:12px;background:var(--bg3);border-radius:var(--r);padding:12px 16px;margin-top:1rem}
.ai-spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-text{font-size:13px;color:var(--text2)}
.log-row td{font-size:12px}
.log-action{color:var(--accent)}
.kf-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.kf-row:last-child{border-bottom:none}
.kf-name{flex:1;font-size:13px}
.kf-cost{font-size:12px;color:var(--text2);min-width:110px;text-align:right}
.kf-select{width:90px}
.kf-price{font-size:13px;font-weight:600;min-width:120px;text-align:right;color:var(--accent)}
.higold-box{background:var(--bg3);border-radius:var(--r);padding:12px;margin-top:1rem;border:1px solid var(--border)}
.higold-title{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.notify-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;margin-right:6px}
@media(max-width:640px){
  .main-layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid2,.grid3,.metrics{grid-template-columns:1fr}
  .mat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Asia Home</div>
    <div class="login-sub">Система расчёта мебели</div>
    <div class="login-field"><label>Логин</label><input type="text" id="loginUsername" placeholder="Введите логин"></div>
    <div class="login-field"><label>Пароль</label><input type="password" id="loginPassword" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-primary" style="width:100%;padding:10px;font-size:14px;margin-top:.5rem" onclick="doLogin()">Войти</button>
    <div class="login-err" id="loginErr">Неверный логин или пароль</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Asia Home</div>
    <div class="topbar-right">
      <span id="topbarRole" class="role-badge"></span>
      <span id="topbarName" style="font-size:13px;color:var(--text2)"></span>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Выйти</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalInner"></div>
</div>

<script>
const SUPA_URL='https://pdubjnovmbuzdgajwxpp.supabase.co';
const SUPA_KEY='sb_publishable_BXQUtVD_43VzvJSYxKMgIg_UdpSOQlO';
const PROXY_URL='https://asia-home-proxy.fkirill92.workers.dev';

const P={
  ldsp_ru:20000,ldsp_eg:28000,hdf:6500,
  mdf_frez:29000,mdf_frez2:33800,mdf_paint:22000,
  mdf_shpon:26000,mdf_shpon_cos:36300,hdf_paint:10000,
  kromka:200,naves:2400,nsm_d:9500,nsm_t:8500,
  meri:34500,av_hl:46000,av_hk:18000,
  sush_v:16000,sush_n:157580,
  shtanga:5000,light:4600,nogi:400,
  glass4:24000,glass6:28000,mirror:13000,
  prof_alu:18000,rifl:25000,polir:300,
  krep:1,rash:5000,dost:4000,
  higold:1
};

const MAT=[
  {k:'ldsp_ru',l:'ЛДСП Россия',u:'шт'},{k:'ldsp_eg',l:'ЛДСП Egger',u:'шт'},{k:'hdf',l:'ХДФ белый',u:'шт'},
  {k:'mdf_frez',l:'МДФ + фреза',u:'кв.м'},{k:'mdf_frez2',l:'МДФ сл.фреза',u:'кв.м'},{k:'mdf_paint',l:'МДФ покраска',u:'кв.м'},
  {k:'mdf_shpon',l:'МДФ шпон',u:'кв.м'},{k:'mdf_shpon_cos',l:'МДФ шпон косая',u:'кв.м'},{k:'hdf_paint',l:'ХДФ крашен',u:'кв.м'},
  {k:'kromka',l:'Кромка',u:'м'},
  {k:'naves',l:'Навесы Blum',u:'шт'},{k:'nsm_d',l:'НСМ доводчик',u:'шт'},{k:'nsm_t',l:'НСМ Tip-On',u:'шт'},
  {k:'meri',l:'Merivobox',u:'шт'},{k:'av_hl',l:'Авентос HL',u:'шт'},{k:'av_hk',l:'Авентос HK_XS',u:'шт'},
  {k:'sush_v',l:'Сушилка верхн.',u:'шт'},{k:'sush_n',l:'Сушилка нижн. INOXA',u:'шт'},
  {k:'shtanga',l:'Штанга овал',u:'3м'},{k:'light',l:'Подсветка LED',u:'м'},{k:'nogi',l:'Ножки',u:'шт'},
  {k:'glass4',l:'Стекло 4мм',u:'кв.м'},{k:'glass6',l:'Стекло 6мм бронза',u:'кв.м'},{k:'mirror',l:'Зеркало',u:'кв.м'},
  {k:'prof_alu',l:'Профиль алюм.',u:'3м'},{k:'rifl',l:'Рифлёное стекло',u:'кв.м'},{k:'polir',l:'Полировка',u:'м'},
  {k:'krep',l:'Крепления',u:'тг'},{k:'rash',l:'Расходники',u:'компл'},{k:'dost',l:'Доставка',u:'точек'}
];

const KF_OPTIONS=[2.3,2.35,2.4,2.5,2.6,2.7,2.75,2.8,3.0];
const STATUS_LABELS={draft:'Черновик',review:'На проверке',approved:'Утверждён',done:'Готово'};

let currentUser=null,currentSession=null,currentProject=null,currentItems=[],currentPage='projects';

async function db(method,table,body,filter=''){
  const res=await fetch(`${SUPA_URL}/rest/v1/${table}${filter}`,{
    method,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:body?JSON.stringify(body):undefined
  });
  if(!res.ok){console.error(await res.text());return null;}
  const t=await res.text();return t?JSON.parse(t):null;
}
const dbGet=(t,f='')=>db('GET',t,null,f);
const dbPost=(t,b)=>db('POST',t,b);
const dbPatch=(t,b,f)=>db('PATCH',t,b,f);
const dbDelete=(t,f)=>db('DELETE',t,null,f);

async function doLogin(){
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginErr');
  err.style.display='none';
  const users=await dbGet('users',`?username=eq.${encodeURIComponent(username)}&password_hash=eq.${encodeURIComponent(password)}`);
  if(!users||users.length===0){err.style.display='block';return;}
  currentUser=users[0];
  const sessions=await dbPost('sessions',{user_id:currentUser.id,ip_address:'web',user_agent:navigator.userAgent});
  currentSession=sessions?sessions[0]:null;
  await logAction('login',{username});
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}

async function doLogout(){
  if(currentSession)await dbPatch('sessions',{logout_at:new Date().toISOString()},`?id=eq.${currentSession.id}`);
  await logAction('logout',{});
  currentUser=null;currentSession=null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUsername').value='';
  document.getElementById('loginPassword').value='';
}

async function logAction(action,details){
  if(!currentUser)return;
  await dbPost('activity_log',{user_id:currentUser.id,action,details});
}

function initApp(){
  const role=currentUser.role;
  const name=currentUser.full_name||currentUser.username;
  document.getElementById('topbarName').textContent=name;
  const rb=document.getElementById('topbarRole');
  rb.textContent=role==='manager'?'Менеджер':role==='owner'?'Владелец':'Фин. директор';
  rb.className='role-badge role-'+role;
  const nav=[
    {id:'projects',icon:'📋',label:'Проекты',roles:['manager','owner','fin']},
    {id:'review',icon:'🔍',label:'На проверке',roles:['owner']},
    {id:'kf',icon:'⚙️',label:'КФ и расчёт',roles:['owner']},
    {id:'reports',icon:'📊',label:'Отчёты',roles:['owner','fin']},
    {id:'log',icon:'🕐',label:'Активность',roles:['owner']},
    {id:'users',icon:'👥',label:'Сотрудники',roles:['owner']},
  ].filter(n=>n.roles.includes(role));
  document.getElementById('sidebar').innerHTML=nav.map(n=>`<div class="nav-item" id="nav_${n.id}" onclick="goto('${n.id}')"><span class="nav-icon">${n.icon}</span>${n.label}</div>`).join('');
  goto('projects');
}

function goto(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('nav_'+page);
  if(el)el.classList.add('active');
  const pages={projects:renderProjects,review:renderReview,kf:renderKF,reports:renderReports,log:renderLog,users:renderUsers};
  if(pages[page])pages[page]();
}

const fmt=n=>Math.round(n).toLocaleString('ru-RU');

function calcCost(it){
  const m=it.materials||{};
  let base=MAT.reduce((s,f)=>{const q=Number(m[f.k])||0;return q?s+q*P[f.k]:s;},0);
  if(m.higold_cost&&m.higold_cost>0){
    const hkf=m.higold_qty>=3?1.4:1.6;
    base+=m.higold_cost*hkf;
  }
  return base;
}

function calcBase(it){
  const m=it.materials||{};
  return MAT.reduce((s,f)=>{const q=Number(m[f.k])||0;return q?s+q*P[f.k]:s;},0);
}

async function renderProjects(){
  const role=currentUser.role;
  document.getElementById('mainContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <div class="page-title">Проекты</div>
      ${role!=='fin'?'<button class="btn-primary" onclick="openNewProject()">+ Новый проект</button>':''}
    </div>
    <div id="projectsList"><div style="color:var(--text2);font-size:13px">Загрузка...</div></div>`;
  const filter=role==='manager'?`?created_by=eq.${currentUser.id}&order=created_at.desc`:'?order=created_at.desc';
  const projects=await dbGet('projects',filter);
  if(!projects||projects.length===0){
    document.getElementById('projectsList').innerHTML='<div style="color:var(--text2);font-size:13px;padding:1rem 0">Проектов пока нет</div>';
    return;
  }
  const rows=await Promise.all(projects.map(async p=>{
    const items=await dbGet('project_items',`?project_id=eq.${p.id}`);
    const total=(items||[]).reduce((s,it)=>s+calcCost(it)*(it.kf||2.6),0);
    const sl=STATUS_LABELS[p.status]||p.status;
    return `<tr>
      <td><div style="font-weight:500">${p.title}</div><div style="font-size:11px;color:var(--text2)">${p.client||''}${p.city?` · ${p.city}`:''}</div></td>
      <td><span class="badge badge-${p.status}">${sl}</span></td>
      <td>${(items||[]).length}</td>
      ${role!=='manager'?`<td style="text-align:right;font-weight:500;color:var(--accent)">${total?fmt(total)+' тг':'—'}</td>`:''}
      <td style="color:var(--text2);font-size:12px">${new Date(p.created_at).toLocaleDateString('ru-RU')}</td>
      <td><button class="btn-ghost btn-sm" onclick="openProject('${p.id}')">Открыть →</button></td>
    </tr>`;
  }));
  document.getElementById('projectsList').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>Проект / клиент</th><th>Статус</th><th>Изделий</th>${role!=='manager'?'<th style="text-align:right">Сумма</th>':''}<th>Дата</th><th></th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

function openNewProject(){
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">Новый проект</div>
    <div class="grid2" style="margin-bottom:1rem">
      <div class="field" style="grid-column:1/-1"><label>Название проекта</label><input id="mp_title" type="text" placeholder="ЖК Верона, кв. 71"></div>
      <div class="field"><label>Клиент</label><input id="mp_client" type="text"></div>
      <div class="field"><label>Город</label><input id="mp_city" type="text" value="Караганда"></div>
      <div class="field"><label>Дизайнер</label><input id="mp_designer" type="text"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="saveNewProject()">Создать</button>
      <button class="btn-ghost" onclick="closeModal()">Отмена</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

async function saveNewProject(){
  const title=document.getElementById('mp_title').value.trim();
  if(!title)return;
  const p=await dbPost('projects',{title,client:document.getElementById('mp_client').value,city:document.getElementById('mp_city').value,designer:document.getElementById('mp_designer').value,created_by:currentUser.id,status:'draft'});
  await logAction('project_created',{title});
  closeModal();
  if(p&&p[0])openProject(p[0].id);else renderProjects();
}

async function openProject(projectId){
  const projects=await dbGet('projects',`?id=eq.${projectId}`);
  currentProject=projects?projects[0]:null;
  if(!currentProject)return;
  currentItems=await dbGet('project_items',`?project_id=eq.${projectId}&order=position.asc`)||[];
  renderProjectDetail();
}

function renderProjectDetail(){
  const role=currentUser.role;
  const p=currentProject;
  const items=currentItems;
  const totCost=items.reduce((s,it)=>s+calcCost(it),0);
  const totPrice=items.reduce((s,it)=>s+calcCost(it)*(it.kf||2.6),0);
  document.getElementById('mainContent').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">
      <button class="btn-ghost btn-sm" onclick="goto('projects')">← Назад</button>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:600">${p.title}</div>
        <div style="font-size:12px;color:var(--text2)">${p.client||''}${p.city?' · '+p.city:''}</div>
      </div>

async function handlePDF(input){
  if(!input.files[0])return;
  const loader=document.getElementById('aiLoader');
  loader.style.display='flex';
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const base64=e.target.result.split(',')[1];
    document.getElementById('aiText').textContent='Анализирую планировки и мебель...';
    try{
      const response=await fetch(PROXY_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:8000,
          messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Ты — эксперт по мебельному производству. Проанализируй этот дизайн-проект квартиры и составь список всех мебельных изделий на заказ.

Для каждого изделия верни JSON объект:
- name: название изделия
- room: помещение  
- description: массив строк с описанием (материалы, фурнитура)
- note: что НЕ включено в стоимость
- higold_cost: закупочная стоимость аксессуаров HIGOLD в тг (0 если нет)
- higold_qty: количество позиций HIGOLD (для коэф: 1-2 шт = ×1.6, 3+ = ×1.4)
- materials: объект:
  ldsp_ru, ldsp_eg (листов ЛДСП), hdf (листов ХДФ),
  mdf_frez, mdf_frez2, mdf_paint, mdf_shpon, mdf_shpon_cos, hdf_paint (кв.м),
  kromka (м), naves, nsm_d, nsm_t, meri, av_hl, av_hk, sush_v, sush_n (шт),
  shtanga (3м), light (м), nogi (шт),
  glass4, glass6, mirror (кв.м), prof_alu (3м), rifl (кв.м), polir (м),
  krep (тг, обычно 20000-40000), rash (компл, 4-8), dost (точек, 3-6)

Правила:
- ЛДСП 2750×1830мм, КЗФ ~1.35
- Фасад ≤1200мм = 2 навеса, >1200мм = 4 навеса
- Кромка ~20м на лист ЛДСП
- ХДФ: 1 лист на 2-3 листа ЛДСП
- Максимум 15 изделий — только крупные

Верни ТОЛЬКО JSON массив, без markdown.`}
          ]}]
        })
      });
      const data=await response.json();
      if(!data.content||!data.content[0])throw new Error('Нет ответа: '+JSON.stringify(data));
      const text=data.content[0].text;
      const clean=text.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      document.getElementById('aiText').textContent=`Найдено изделий: ${parsed.length}. Сохраняю...`;
      for(let i=0;i<parsed.length;i++){
        const it=parsed[i];
        const mats=it.materials||{};
        if(it.higold_cost)mats.higold_cost=it.higold_cost;
        if(it.higold_qty)mats.higold_qty=it.higold_qty;
        await dbPost('project_items',{
          project_id:currentProject.id,position:i,
          name:it.name,room:it.room,
          description:it.description||[],
          note:it.note||'',kf:2.6,
          materials:mats
        });
      }
      await dbPatch('projects',{status:'review'},`?id=eq.${currentProject.id}`);
      currentProject.status='review';
      currentItems=await dbGet('project_items',`?project_id=eq.${currentProject.id}&order=position.asc`)||[];
      await logAction('pdf_uploaded',{project:currentProject.title,items:parsed.length});
      loader.style.display='none';
      document.getElementById('aiResult').innerHTML=`<div style="color:var(--green);font-size:13px;margin-top:1rem">✓ Готово! Найдено ${parsed.length} изделий. Проект отправлен на проверку.</div>`;
      setTimeout(()=>switchTab('vedom'),1500);
    }catch(err){
      loader.style.display='none';
      document.getElementById('aiResult').innerHTML=`<div style="color:var(--red);font-size:13px;margin-top:1rem">Ошибка: ${err.message}</div>`;
    }
  };
  reader.readAsDataURL(input.files[0]);
}

function updateCostPreview(){
  const m={};
  MAT.forEach(f=>{m[f.k]=Number(document.getElementById('mf_'+f.k)?.value)||0;});
  const hcost=Number(document.getElementById('it_higold_cost')?.value)||0;
  const hqty=Number(document.getElementById('it_higold_qty')?.value)||0;
  const hkf=hqty>=3?1.4:1.6;
  const base=MAT.reduce((s,f)=>s+(m[f.k]?m[f.k]*P[f.k]:0),0);
  const cost=base+(hcost?hcost*hkf:0);
  const kf=parseFloat(document.getElementById('it_kf')?.value)||2.6;
  document.getElementById('cpCost').textContent=fmt(cost)+' тг';
  document.getElementById('cpPrice').textContent=fmt(cost*kf)+' тг';
}

async function saveItem(){
  const m={};
  MAT.forEach(f=>{const v=Number(document.getElementById('mf_'+f.k)?.value)||0;if(v)m[f.k]=v;});
  const hcost=Number(document.getElementById('it_higold_cost')?.value)||0;
  const hqty=Number(document.getElementById('it_higold_qty')?.value)||0;
  if(hcost)m.higold_cost=hcost;
  if(hqty)m.higold_qty=hqty;
  const payload={
    name:document.getElementById('it_name').value,
    room:document.getElementById('it_room').value,
    kf:parseFloat(document.getElementById('it_kf').value)||2.6,

    description:modalDesc,materials:m,

    position:editingItemIdx===null?currentItems.length:currentItems[editingItemIdx].position

    const cost=items.reduce((s,it)=>s+calcCost(it),0);

    return `<tr><td>${p.title}</td><td style="color:var(--text2)">${p.client||'—'}</td>
      <td><span class="badge badge-${p.status}">${STATUS_LABELS[p.status]||p.status}</span></td>
      <td style="text-align:right">${fmt(cost)} тг</td>
      <td style="text-align:right;color:var(--accent);font-weight:500">${fmt(price)} тг</td>
      <td style="text-align:right;color:var(--green)">${price?fmt(price-cost)+' тг':'—'}</td>
    </tr>`;
  }));
  document.getElementById('repContent').innerHTML=`
    <div class="metrics">
      <div class="metric"><div class="metric-label">Выручка</div><div class="metric-value" style="color:var(--accent)">${fmt(totalRev)}</div><div class="metric-sub">тенге</div></div>
      <div class="metric"><div class="metric-label">Себестоимость</div><div class="metric-value">${fmt(totalCost)}</div><div class="metric-sub">тенге</div></div>
      <div class="metric"><div class="metric-label">Валовая прибыль</div><div class="metric-value" style="color:var(--green)">${fmt(totalRev-totalCost)}</div><div class="metric-sub">${totalRev?Math.round((totalRev-totalCost)/totalRev*100):0}%</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Проект</th><th>Клиент</th><th>Статус</th><th style="text-align:right">Себест.</th><th style="text-align:right">Цена</th><th style="text-align:right">Прибыль</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`;
}

async function renderLog(){
  document.getElementById('mainContent').innerHTML=`<div class="page-title">Журнал активности</div><div id="logContent"><div style="color:var(--text2)">Загрузка...</div></div>`;
  const logs=await dbGet('activity_log','?order=created_at.desc&limit=200');
  const users=await dbGet('users')||[];
  const userMap=Object.fromEntries(users.map(u=>[u.id,u.full_name||u.username]));
  const actionNames={login:'Вход',logout:'Выход',project_created:'Создан проект',pdf_uploaded:'Загружен PDF',item_added:'Добавлено изделие',item_edited:'Изменено изделие',item_deleted:'Удалено изделие',kf_updated:'Изменён КФ',sent_to_review:'На проверку',project_approved:'Утверждён',notify_owner:'Уведомление'};
  document.getElementById('logContent').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Детали</th></tr></thead>
    <tbody>${(logs||[]).map(l=>`<tr class="log-row">
      <td>${new Date(l.created_at).toLocaleString('ru-RU')}</td>
      <td>${userMap[l.user_id]||'—'}</td>
      <td class="log-action">${actionNames[l.action]||l.action}</td>
      <td style="color:var(--text2)">${l.details?JSON.stringify(l.details).slice(0,80):''}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

async function renderUsers(){
  document.getElementById('mainContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <div class="page-title">Сотрудники</div>
      <button class="btn-primary btn-sm" onclick="openAddUser()">+ Добавить</button>
    </div>
    <div id="userList"><div style="color:var(--text2)">Загрузка...</div></div>`;
  const users=await dbGet('users','?order=created_at.asc');
  document.getElementById('userList').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Дата</th><th></th></tr></thead>
    <tbody>${(users||[]).map(u=>`<tr>
      <td style="font-weight:500">${u.full_name||'—'}</td>
      <td style="color:var(--text2)">${u.username}</td>
      <td><span class="role-badge role-${u.role}">${{manager:'Менеджер',owner:'Владелец',fin:'Фин. директор'}[u.role]}</span></td>
      <td style="color:var(--text2);font-size:12px">${new Date(u.created_at).toLocaleDateString('ru-RU')}</td>
      <td>${u.username!=='kirill'?`<button class="btn-ghost btn-sm" onclick="changePassword('${u.id}','${u.username}')">Пароль</button>`:''}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function openAddUser(){
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">Новый сотрудник</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:1.5rem">
      <div class="field"><label>Полное имя</label><input id="nu_name" type="text"></div>
      <div class="field"><label>Логин</label><input id="nu_login" type="text"></div>
      <div class="field"><label>Пароль</label><input id="nu_pass" type="password"></div>
      <div class="field"><label>Роль</label><select id="nu_role"><option value="manager">Менеджер</option><option value="fin">Фин. директор</option></select></div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="saveNewUser()">Добавить</button>
      <button class="btn-ghost" onclick="closeModal()">Отмена</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

async function saveNewUser(){
  const u={full_name:document.getElementById('nu_name').value,username:document.getElementById('nu_login').value,password_hash:document.getElementById('nu_pass').value,role:document.getElementById('nu_role').value};
  if(!u.username||!u.password_hash)return;
  await dbPost('users',u);closeModal();renderUsers();
}

function changePassword(id,username){
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">Смена пароля — ${username}</div>
    <div class="field" style="margin-bottom:1.5rem"><label>Новый пароль</label><input id="np_pass" type="password"></div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="savePassword('${id}')">Сохранить</button>
      <button class="btn-ghost" onclick="closeModal()">Отмена</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

async function savePassword(id){
  const pass=document.getElementById('np_pass').value;
  if(!pass)return;
  await dbPatch('users',{password_hash:pass},`?id=eq.${id}`);
  closeModal();
}

async function loadFont(){
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    const fontResp=await fetch('./NotoSans-Regular.ttf');
    const fontBuf=await fontResp.arrayBuffer();
    const uint8=new Uint8Array(fontBuf);
    let binary='';
    for(let i=0;i<uint8.length;i+=8192)binary+=String.fromCharCode(...uint8.subarray(i,i+8192));
    return btoa(binary);
  }catch(e){return null;}
}

async function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',putOnlyUsedFonts:true});
  const p=currentProject;
  const items=currentItems;
  const totPrice=items.reduce((s,it)=>s+calcCost(it)*(it.kf||2.6),0);
  const f=n=>Math.round(n).toLocaleString('ru-RU');

  const fontB64=await loadFont();
  if(fontB64){
    doc.addFileToVFS('NotoSans.ttf',fontB64);
    doc.addFont('NotoSans.ttf','NotoSans','normal');
    doc.setFont('NotoSans');
  } else {
    doc.setFont('helvetica');
  }

  doc.setFontSize(20);doc.setTextColor(40,40,40);
  doc.text('Asia Home',20,22);
  doc.setFontSize(10);doc.setTextColor(120,120,120);
  doc.text('Коммерческое предложение',20,29);
  doc.text(`${p.title}${p.client?' · '+p.client:''}`,20,35);
  doc.text(`${p.city||'Караганда'} · ${new Date().toLocaleDateString('ru-RU')}`,20,41);
  doc.setDrawColor(220,220,220);doc.line(20,46,190,46);

  let y=54;
  items.forEach((it,i)=>{
    if(y>260){doc.addPage();y=20;}
    const cost=calcCost(it);const price=cost*(it.kf||2.6);
    doc.setFontSize(11);doc.setTextColor(40,40,40);
    doc.text(`${i+1}. ${it.name||'—'}`,20,y);
    doc.setTextColor(180,140,80);
    doc.text(`${f(price)} тг`,190,y,{align:'right'});
    y+=5;
    if(it.room){doc.setFontSize(9);doc.setTextColor(120,120,120);doc.text(it.room,20,y);y+=5;}
    if(it.description&&it.description.length){
      doc.setFontSize(9);doc.setTextColor(80,80,80);
      it.description.slice(0,6).forEach(d=>{
        if(y>268){doc.addPage();y=20;}
        const lines=doc.splitTextToSize('• '+d,165);
        doc.text(lines,25,y);y+=lines.length*4.5;
      });
    }
    if(it.note){
      doc.setFontSize(8);doc.setTextColor(150,150,150);
      const nl=doc.splitTextToSize(it.note,160);
      doc.text(nl,25,y);y+=nl.length*4+2;
    }
    y+=3;doc.setDrawColor(235,235,235);doc.line(20,y,190,y);y+=6;
  });

  if(y>255){doc.addPage();y=20;}
  y+=4;
  doc.setFontSize(13);doc.setTextColor(40,40,40);doc.text('Итого:',130,y);
  doc.setTextColor(180,140,80);doc.text(`${f(totPrice)} тг`,190,y,{align:'right'});
  y+=7;doc.setFontSize(10);doc.setTextColor(120,120,120);
  doc.text(`Предоплата 80%: ${f(totPrice*.8)} тг`,130,y);
  y+=5;doc.text(`Остаток 20%: ${f(totPrice*.2)} тг`,130,y);
  y+=12;doc.setFontSize(8);doc.setTextColor(160,160,160);
  doc.text('В стоимость включены: разработка чертежей, производство, доставка, монтаж, гарантия 3 года.',20,y);
  doc.text('КП является предварительным. Окончательная стоимость после контрольного замера.',20,y+5);

  doc.save(`КП_${p.title}_${new Date().toLocaleDateString('ru-RU').replace(/\./g,'-')}.pdf`);
  await logAction('pdf_exported',{project:p.title});
}

async function exportVedomPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',putOnlyUsedFonts:true});
  const p=currentProject;
  const items=currentItems;
  const f=n=>Math.round(n).toLocaleString('ru-RU');

  const fontB64=await loadFont();
  if(fontB64){
    doc.addFileToVFS('NotoSans.ttf',fontB64);
    doc.addFont('NotoSans.ttf','NotoSans','normal');
    doc.setFont('NotoSans');
  } else {
    doc.setFont('helvetica');
  }

  doc.setFontSize(16);doc.setTextColor(40,40,40);
  doc.text('Asia Home — Ведомость материалов',20,20);
  doc.setFontSize(10);doc.setTextColor(120,120,120);
  doc.text(`${p.title}${p.client?' · '+p.client:''}`,20,27);
  doc.text(new Date().toLocaleDateString('ru-RU'),20,33);
  doc.setDrawColor(220,220,220);doc.line(20,38,190,38);

  const totals={};
  MAT.forEach(f2=>{totals[f2.k]=items.reduce((s,it)=>s+(Number((it.materials||{})[f2.k])||0),0);});

  let y=46;
  doc.setFontSize(11);doc.setTextColor(40,40,40);
  doc.text('Изделие',20,y);doc.text('Помещение',90,y);doc.text('Осн. материалы',140,y);
  y+=2;doc.setDrawColor(180,180,180);doc.line(20,y,190,y);y+=6;

  items.forEach((it,i)=>{
    if(y>270){doc.addPage();y=20;}
    const m=it.materials||{};
    const mats=MAT.filter(f2=>Number(m[f2.k])>0).slice(0,3).map(f2=>`${f2.l}:${m[f2.k]}`).join(', ');
    doc.setFontSize(9);doc.setTextColor(40,40,40);
    doc.text(`${i+1}. ${it.name||'—'}`,20,y);
    doc.text(it.room||'—',90,y);
    doc.setTextColor(100,100,100);
    const ml=doc.splitTextToSize(mats||'—',50);
    doc.text(ml,140,y);
    y+=ml.length*4+2;
    doc.setDrawColor(240,240,240);doc.line(20,y,190,y);y+=4;
  });

  y+=6;
  doc.setFontSize(12);doc.setTextColor(40,40,40);
  doc.text('Сводная ведомость',20,y);y+=8;
  doc.setFontSize(9);
  doc.text('Материал',20,y);doc.text('Кол-во',120,y);doc.text('Ед.',155,y);doc.text('Сумма',170,y);
  y+=2;doc.setDrawColor(180,180,180);doc.line(20,y,190,y);y+=5;

  MAT.filter(f2=>totals[f2.k]>0).forEach(f2=>{
    if(y>275){doc.addPage();y=20;}
    doc.setTextColor(40,40,40);doc.text(f2.l,20,y);
    doc.text(String(totals[f2.k]),120,y);
    doc.setTextColor(100,100,100);doc.text(f2.u,155,y);
    doc.text(f(totals[f2.k]*P[f2.k])+' тг',190,y,{align:'right'});
    y+=5;
  });

  doc.save(`Ведомость_${p.title}_${new Date().toLocaleDateString('ru-RU').replace(/\./g,'-')}.pdf`);
  await logAction('vedom_exported',{project:p.title});
}
